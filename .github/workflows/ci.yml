name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan Rails security vulnerabilities
        run: bin/brakeman --no-pager

      - name: Scan Ruby gem vulnerabilities
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint Ruby code
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1

      DB_PROVISIONER_USERNAME: root
      DB_PROVISIONER_PASSWORD: root

      DB_MIGRATION_USERNAME: root
      DB_MIGRATION_PASSWORD: root

      LOCALFIND_MAIN_DB_USERNAME: localfind_main
      LOCALFIND_MAIN_DB_PASSWORD: ci_main_password

      ADMIN_DASHBOARD_DB_USERNAME: localfind_admin_dashboard
      ADMIN_DASHBOARD_DB_PASSWORD: ci_admin_password

      SECURITY_LOGS_DB_USERNAME: localfind_security_logs
      SECURITY_LOGS_DB_PASSWORD: ci_security_password

      ADMIN_DASHBOARD_JWT_SECRET: ci_admin_jwt_secret_for_testing_only
      SECURITY_LOGS_JWT_SECRET: ci_security_jwt_secret_for_testing_only

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install MySQL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Provision database accounts
        run: bundle exec ruby script/provision_service_accounts.rb

      - name: Create databases and load schema
        run: bin/rails db:create db:schema:load

      - name: Run RSpec tests
        run: bundle exec rspec
