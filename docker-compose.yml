services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: local_find_development
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db

  login-audit:
    image: node:22
    working_dir: /mfe
    command: bash -c "npm install && npm start"
    volumes:
      - ./mfe/login-audit:/mfe
      - login_audit_node_modules:/mfe/node_modules
    ports:
      - "8500:8500"

volumes:
  mysql_data:
  login_audit_node_modules: