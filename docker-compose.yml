services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: local_find_development
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      AUDIT_API_KEY: ${AUDIT_API_KEY:?Set AUDIT_API_KEY in .env}
      AUDIT_API_URL: ${AUDIT_API_URL:-http://127.0.0.1:3100}
    depends_on:
      - db

  audit-api:
    build:
      context: ./services/audit-api
      dockerfile: Dockerfile.dev
    command: bash -c "bundle install && rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0 -p 3100"
    volumes:
      - ./services/audit-api:/app
      - audit_api_bundle:/usr/local/bundle
    environment:
      AUDIT_API_KEY: ${AUDIT_API_KEY:?Set AUDIT_API_KEY in .env}
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    ports:
      - "3100:3100"
    depends_on:
      - db

  login-audit:
    image: node:22
    working_dir: /mfe
    command: bash -c "npm install && npm start"
    volumes:
      - ./mfe/login-audit:/mfe
      - login_audit_node_modules:/mfe/node_modules
    ports:
      - "8500:8500"

volumes:
  mysql_data:
  login_audit_node_modules:
  audit_api_bundle: