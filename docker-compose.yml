services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: local_find_development
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  db-access-setup:
    profiles: ["db-admin"]
    build: .
    command: bundle exec ruby script/provision_service_accounts.rb
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PROVISIONER_USERNAME: root
      DB_PROVISIONER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      LOCALFIND_MAIN_DB_USERNAME: ${LOCALFIND_MAIN_DB_USERNAME:-localfind_main}
      LOCALFIND_MAIN_DB_PASSWORD: ${LOCALFIND_MAIN_DB_PASSWORD:?Set LOCALFIND_MAIN_DB_PASSWORD in .env}
      ADMIN_DASHBOARD_DB_USERNAME: ${ADMIN_DASHBOARD_DB_USERNAME:-localfind_admin_dashboard}
      ADMIN_DASHBOARD_DB_PASSWORD: ${ADMIN_DASHBOARD_DB_PASSWORD:?Set ADMIN_DASHBOARD_DB_PASSWORD in .env}
      SECURITY_LOGS_DB_USERNAME: ${SECURITY_LOGS_DB_USERNAME:-localfind_security_logs}
      SECURITY_LOGS_DB_PASSWORD: ${SECURITY_LOGS_DB_PASSWORD:?Set SECURITY_LOGS_DB_PASSWORD in .env}
      ADMIN_DASHBOARD_JWT_SECRET: ${ADMIN_DASHBOARD_JWT_SECRET:?Set ADMIN_DASHBOARD_JWT_SECRET in .env}
      SECURITY_LOGS_JWT_SECRET: ${SECURITY_LOGS_JWT_SECRET:?Set SECURITY_LOGS_JWT_SECRET in .env}
    depends_on:
      - db

  db-migrate:
    profiles: ["db-admin", "migration"]
    build: .
    command: bundle exec rails db:migrate
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_MIGRATION_USERNAME: root
      DB_MIGRATION_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      LOCALFIND_MAIN_DB_USERNAME: ${LOCALFIND_MAIN_DB_USERNAME:-localfind_main}
      LOCALFIND_MAIN_DB_PASSWORD: ${LOCALFIND_MAIN_DB_PASSWORD:?Set LOCALFIND_MAIN_DB_PASSWORD in .env}
      ADMIN_DASHBOARD_JWT_SECRET: ${ADMIN_DASHBOARD_JWT_SECRET:?Set ADMIN_DASHBOARD_JWT_SECRET in .env}
      SECURITY_LOGS_JWT_SECRET: ${SECURITY_LOGS_JWT_SECRET:?Set SECURITY_LOGS_JWT_SECRET in .env}
    depends_on:
      - db

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      ADMIN_DASHBOARD_PUBLIC_KEY_PATH: /app/config/credentials/internal/admin_dashboard_public.pem
      ADMIN_DASHBOARD_JWT_SECRET: ${ADMIN_DASHBOARD_JWT_SECRET:?Set ADMIN_DASHBOARD_JWT_SECRET in .env}
      SECURITY_LOGS_JWT_SECRET: ${SECURITY_LOGS_JWT_SECRET:?Set SECURITY_LOGS_JWT_SECRET in .env}
      LOCALFIND_MAIN_DB_USERNAME: ${LOCALFIND_MAIN_DB_USERNAME:-localfind_main}
      LOCALFIND_MAIN_DB_PASSWORD: ${LOCALFIND_MAIN_DB_PASSWORD:?Set LOCALFIND_MAIN_DB_PASSWORD in .env}
      DB_PROVISIONER_USERNAME: root
      DB_PROVISIONER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      DB_HOST: db
      ADMIN_API_URL: ${ADMIN_API_URL:-${AUDIT_API_URL:-http://127.0.0.1:3100}}
      SECURITY_LOGS_API_URL: ${SECURITY_LOGS_API_URL:-http://127.0.0.1:3101}
    depends_on:
      - db

  admin-dashboard-api:
    build:
      context: .
      dockerfile: services/admin-dashboard-api/Dockerfile.dev
    command: bash -c "bundle install && rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0 -p 3100"
    volumes:
      - ./services/admin-dashboard-api:/app
      - ./shared/localfind_shared:/shared/localfind_shared
      - admin_dashboard_api_bundle:/usr/local/bundle
      - ./config/credentials/internal/admin_dashboard_private.pem:/run/secrets/admin_dashboard_private.pem:ro
    environment:
      ADMIN_DASHBOARD_PRIVATE_KEY_PATH: /run/secrets/admin_dashboard_private.pem
      ADMIN_DASHBOARD_JWT_SECRET: ${ADMIN_DASHBOARD_JWT_SECRET:?Set ADMIN_DASHBOARD_JWT_SECRET in .env}
      ADMIN_DASHBOARD_DB_USERNAME: ${ADMIN_DASHBOARD_DB_USERNAME:-localfind_admin_dashboard}
      ADMIN_DASHBOARD_DB_PASSWORD: ${ADMIN_DASHBOARD_DB_PASSWORD:?Set ADMIN_DASHBOARD_DB_PASSWORD in .env}
      DB_HOST: db
      MAIN_APP_INTERNAL_URL: http://web:3000
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    ports:
      - "3100:3100"
    depends_on:
      - db

  admin-dashboard:
    image: node:22
    working_dir: /mfe
    command: bash -c "npm install && npm start"
    volumes:
      - ./mfe/admin-dashboard:/mfe
      - admin_dashboard_node_modules:/mfe/node_modules
    ports:
      - "8500:8500"

  security-logs:
    image: node:22
    working_dir: /mfe
    command: bash -c "npm install && npm start"
    volumes:
      - ./mfe/security-logs:/mfe
      - security_logs_node_modules:/mfe/node_modules
    ports:
      - "8501:8501"

  security-logs-api:
    build:
      context: .
      dockerfile: services/security-logs-api/Dockerfile.dev
    command: bash -c "bundle install && rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0 -p 3101"
    volumes:
      - ./services/security-logs-api:/app
      - ./shared/localfind_shared:/shared/localfind_shared
      - security_logs_api_bundle:/usr/local/bundle
    environment:
      SECURITY_LOGS_JWT_SECRET: ${SECURITY_LOGS_JWT_SECRET:?Set SECURITY_LOGS_JWT_SECRET in .env}
      SECURITY_LOGS_DB_USERNAME: ${SECURITY_LOGS_DB_USERNAME:-localfind_security_logs}
      SECURITY_LOGS_DB_PASSWORD: ${SECURITY_LOGS_DB_PASSWORD:?Set SECURITY_LOGS_DB_PASSWORD in .env}
      DB_HOST: db
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    ports:
      - "3101:3101"
    depends_on:
      - db

volumes:
  mysql_data:
  admin_dashboard_node_modules:
  security_logs_node_modules:
  security_logs_api_bundle:
  admin_dashboard_api_bundle:
