default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 1) %>
  username: <%= ENV.fetch("SECURITY_LOGS_DB_USERNAME", "localfind_security_logs") %>
  password: <%= ENV.fetch("SECURITY_LOGS_DB_PASSWORD") %>
  host: <%= ENV.fetch("DB_HOST", "db") %>

development:
  <<: *default
  database: local_find_development

test:
  <<: *default
  database: local_find_test

production:
  <<: *default
  database: local_find_production
